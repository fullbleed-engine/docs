[package]
name = "fullbleed-yew-sheet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
fullbleed = { version = "=2.5.34", features = ["svg_raster"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
yew = { version = "=0.23.0", features = ["ssr"] }

[profile.dev]
debug = 0
incremental = false
