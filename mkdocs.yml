site_name: Fullbleed
site_url: https://docs.fullbleed.dev/
site_description: Generate PDFs from HTML/CSS in Python, Rust, JavaScript, and C#. Build invoices, reports, and print documents with bundled fonts and local output. MIT licensed.
site_author: Fullbleed Engine
repo_url: https://github.com/fullbleed-engine/fullbleed-official
repo_name: Fullbleed on GitHub
edit_uri: ''
theme:
  name: material
  favicon: assets/brand/fullbleed-print-mark.svg
  custom_dir: overrides
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
extra_css:
  - stylesheets/extra.css
plugins:
  - search
  - redirects:
      redirect_maps:
        engine/headers-footers.md: engine/pdf-engine.md
        engine/paginated-context.md: engine/pdf-engine.md
        engine/page-margins.md: engine/pdf-engine.md
        engine/watermarks.md: engine/pdf-engine.md
        engine/batch.md: guides/bank-statements.md
        cli/scaffolding.md: getting-started/quickstart.md
        cli/diagnostics.md: cli/commands.md
        ui/primitives.md: ui/overview.md
        ui/accessibility.md: ui/overview.md
        ui/style.md: ui/overview.md
        accessibility/engine.md: ui/overview.md
        accessibility/evidence-bundles.md: accessibility/overview.md
        accessibility/coverage.md: accessibility/overview.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
extra:
  generator: false
copyright: 'Fullbleed Engine · MIT licensed · <a href="https://docs.fullbleed.dev/support/">Support Fullbleed</a>'
