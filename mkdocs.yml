site_name: Fullbleed
site_url: https://docs.fullbleed.dev/
site_description: Generate PDFs from HTML and CSS in Python, Rust, Node.js, and C#. Start with a runnable example and a Rust print engine. MIT licensed.
site_author: Fullbleed Engine
repo_url: https://github.com/fullbleed-engine/fullbleed-official
repo_name: Fullbleed on GitHub
edit_uri: ''
theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
extra_css:
  - stylesheets/extra.css
plugins:
  - search
  - redirects:
      redirect_maps:
        engine/headers-footers.md: engine/pdf-engine.md
        engine/paginated-context.md: engine/pdf-engine.md
        engine/page-margins.md: engine/pdf-engine.md
        engine/watermarks.md: engine/pdf-engine.md
        engine/batch.md: guides/bank-statements.md
        cli/scaffolding.md: getting-started/quickstart.md
        cli/diagnostics.md: cli/commands.md
        ui/primitives.md: ui/overview.md
        ui/accessibility.md: ui/overview.md
        ui/style.md: ui/overview.md
        accessibility/engine.md: ui/overview.md
        accessibility/evidence-bundles.md: accessibility/overview.md
        accessibility/coverage.md: accessibility/overview.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
extra:
  generator: false
copyright: 'Fullbleed Engine · MIT licensed · <a href="https://docs.fullbleed.dev/support/">Support Fullbleed</a>'
nav:
  - Home: index.md
  - Get started:
    - Try in your browser: playground.md
    - Python quickstart: getting-started/quickstart.md
    - Node.js quickstart: getting-started/node.md
    - Rust quickstart: getting-started/rust.md
    - C# and .NET quickstart: getting-started/dotnet.md
    - Python installation: getting-started/installation.md
    - Python notebook: getting-started/notebook.md
    - Use WooCommerce: guides/woocommerce.md
    - Python fonts and previews: getting-started/first-pdf.md
    - Examples and downloads: examples.md
  - Build a document:
    - Invoices from data: guides/invoices.md
    - pandas DataFrame to PDF: guides/pandas-to-pdf.md
    - Rebuild as you edit: guides/render-watch.md
    - Check PDFs in CI: guides/pdf-regression-ci.md
    - FastAPI, Flask, and Django: guides/web-frameworks.md
    - Next.js PDF downloads: guides/nextjs-pdf.md
    - ASP.NET Core PDF downloads: guides/aspnet-pdf.md
    - Variable-data documents: guides/bank-statements.md
    - Tagged PDF and accessibility: accessibility/overview.md
    - Print output and PDF/VT: guides/print-output.md
    - Coding agents and MCP: guides/ai-agents.md
  - Reference:
    - Python API: engine/pdf-engine.md
    - CLI: cli/commands.md
    - Fonts and assets: engine/assets.md
    - Python components: ui/overview.md
    - PDF template composition: engine/template-composition.md
    - CSS coverage: css-coverage.md
    - Engine architecture: engine/overview.md
  - Evaluate:
    - Choose a PDF library: guides/comparison.md
    - Performance evidence: guides/performance.md
    - FAQ: faq.md
  - Contribute and support: support.md
  - Commerce:
    - Shopify preview: commerce/shopify.md
    - Merchant agreement: commerce/agreements/2026-10-04.md
    - Privacy: commerce/privacy.md
