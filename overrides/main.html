{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  {% if page %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default(config.site_name, true) | e }} · Fullbleed">
  <meta property="og:description" content="{{ page.meta.description | default(config.site_description, true) | e }}">
  <meta property="og:url" content="{{ page.canonical_url | e }}">
  <meta property="og:image" content="{{ config.site_url }}assets/examples/acme-invoice.png">
  <meta name="twitter:card" content="summary_large_image">
  {% endif %}
{% endblock %}
