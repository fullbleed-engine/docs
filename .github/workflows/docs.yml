name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: wasm32-wasip1
          components: rustfmt
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_playground.py
      - run: node tools/verify_playground.mjs
      - name: Compile and render the Rust quickstart examples
        run: python tools/verify_rust_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-quickstart-verification
          path: examples/rust/verification
      - uses: actions/upload-artifact@v4
        with:
          name: playground-verification
          path: |
            docs/assets/playground/build.json
            docs/assets/playground/verification.json
      - run: python -m mkdocs build --strict
      - run: python tools/check_site.py site
      - name: Include search notification ownership file
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          key = os.environ.get("INDEXNOW_KEY", "")
          if key:
              if not re.fullmatch(r"[A-Za-z0-9-]{8,128}", key):
                  raise SystemExit("Invalid IndexNow ownership key format")
              Path("site", key + ".txt").write_text(key, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
