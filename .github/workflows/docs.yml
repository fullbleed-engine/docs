name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n8n-workflow:
    name: n8n invoice workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install independent PDF readers and the browser verifier
        run: python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0 playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify the exact download in the real n8n runtime
        run: |
          python tools/build_n8n_starter.py
          git diff --exit-code -- docs/assets/n8n-starter
          python tools/verify_n8n_starter.py --browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-workflow-verification
          path: output/n8n-verification
          retention-days: 14
  lambda-starter:
    name: Lambda runtime starter (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@v3
      - name: Install the public engine, independent readers, and template validator
        run: |
          python -m pip install --only-binary=:all: fullbleed==2.5.20 pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0 cfn-lint==1.57.2
      - name: Validate CloudFormation and the exact downloadable project
        run: |
          cfn-lint examples/lambda-pdf/template.yaml
          python tools/build_lambda_starter.py
          git diff --exit-code -- docs/assets/lambda-starter/project.zip docs/assets/lambda-starter/source.json
          python tools/verify_lambda_starter.py --docker-arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lambda-verification-${{ matrix.arch }}
          path: output/lambda-verification
          retention-days: 14
  axum:
    name: Axum PDF starter (${{ matrix.os }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: '1.85.0'
          - os: ubuntu-latest
            rust: '1.97.0'
          - os: windows-latest
            rust: '1.97.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt
      - name: Install independent PDF readers and the browser verifier
        run: python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0 playwright==1.63.0
      - name: Install the verification browser
        run: python -m playwright install --with-deps chromium
      - name: Verify the exact ZIP, real HTTP endpoint, and browser downloads
        run: |
          python tools/build_axum_starter.py
          git diff --exit-code -- docs/assets/axum-starter/project.zip docs/assets/axum-starter/source.json
          python tools/verify_axum_starter.py --browser chromium --toolchain ${{ matrix.rust }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axum-verification-${{ matrix.os }}-${{ matrix.rust }}
          path: output/axum-verification
          retention-days: 14
  numbered-report:
    name: Numbered report (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the public engine and independent PDF readers
        run: |
          python -m pip install --only-binary=:all: -r examples/numbered-report/requirements.txt pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0
      - name: Verify the exact download and edited section numbering
        run: |
          python tools/build_numbered_report.py
          git diff --exit-code -- docs/assets/numbered-report/project.zip docs/assets/numbered-report/source.json
          python tools/verify_numbered_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numbered-report-verification-${{ matrix.os }}
          path: output/numbered-report-verification
          retention-days: 14
  matplotlib:
    name: Matplotlib report (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the public engine, chart dependencies and independent readers
        run: |
          python -m pip install --only-binary=:all: -r examples/matplotlib-report/requirements.txt pypdf==6.19.0 pypdfium2==5.14.0
      - name: Verify the actual chart-report ZIP and guide
        run: |
          python tools/build_matplotlib_starter.py
          git diff --exit-code -- docs/assets/matplotlib-report/project.zip docs/assets/matplotlib-report/source.json
          python tools/verify_matplotlib_starter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matplotlib-verification-${{ matrix.os }}
          path: |
            output/matplotlib-verification/*.json
            output/matplotlib-verification/*.txt
            output/matplotlib-verification/*.png
            output/matplotlib-verification/render/
            output/matplotlib-verification/edited/
          retention-days: 14
  arabic:
    name: Arabic and English example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the public engine and independent PDF readers
        run: |
          python -m pip install --only-binary=:all: -r examples/arabic-invoice/requirements.txt pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0
      - name: Verify the actual ZIP, fonts, guide, and customized PDF
        run: |
          python tools/build_arabic_example.py
          git diff --exit-code -- docs/assets/arabic-invoice/project.zip docs/assets/arabic-invoice/source.json
          python tools/verify_arabic_example.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arabic-verification-${{ matrix.os }}
          path: |
            output/arabic-verification/*.json
            output/arabic-verification/*.txt
            output/arabic-verification/*.png
            output/arabic-verification/render/
            output/arabic-verification/edited/
          retention-days: 14
  rust-download:
    name: Rust starter (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt
      - run: python -m pip install pypdf==6.19.0 Pillow==12.3.0
      - name: Verify the actual standalone Rust download
        run: python tools/verify_rust_starter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-starter-verification-Windows
          path: output/rust-starter-verification
          retention-days: 14
  markdown:
    name: Markdown starter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the public engine and independent verification tools
        run: |
          python -m pip install --only-binary=:all: -r examples/markdown/requirements.txt pypdf==6.19.0 pypdfium2==5.14.0 fonttools==4.65.0 Pillow==12.3.0
      - name: Verify the actual ZIP, CLI, fonts, images, and PDF
        run: python tools/verify_markdown_starter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-verification-${{ matrix.os }}
          path: |
            output/markdown-verification/*.json
            output/markdown-verification/*.txt
            output/markdown-verification/*.png
            output/markdown-verification/render/
            output/markdown-verification/edited/
            output/markdown-verification/images/
            output/markdown-verification/extra-font/
          retention-days: 14
  chinese:
    name: Chinese-font example (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the public engine and independent verification tools
        run: |
          python -m pip install --only-binary=:all: -r examples/chinese-invoice/requirements.txt -r examples/chinese-invoice/requirements-fonts.txt pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0
      - name: Verify the actual ZIP, prepared font, guide and PDF
        run: python tools/verify_chinese_example.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-font-verification-${{ matrix.os }}
          path: |
            output/chinese-verification/*.json
            output/chinese-verification/*.txt
            output/chinese-verification/*.png
            output/chinese-verification/render/
            output/chinese-verification/edited/
            output/chinese-verification/missing/
          retention-days: 14
  aspnet:
    name: ASP.NET starter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install pypdf==6.1.1
      - name: Verify the actual ZIP and isolated publish output
        run: python tools/verify_aspnet_starter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aspnet-verification-${{ matrix.os }}
          path: |
            output/aspnet-verification/*.json
            output/aspnet-verification/*.txt
            output/aspnet-verification/*.log
            output/aspnet-verification/preview/*
          retention-days: 14
  tagged-notice:
    name: C# tagged notice (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install pypdf==6.19.0
      - name: Verify the downloaded ZIP and isolated published tagged notice
        run: python tools/verify_dotnet_accessibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-accessibility-verification-${{ matrix.os }}
          path: |
            output/dotnet-accessibility-verification/verification.json
            output/dotnet-accessibility-verification/*.txt
            output/dotnet-accessibility-verification/ua1/
            output/dotnet-accessibility-verification/ua2/
          retention-days: 14
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: wasm32-wasip1
          components: rustfmt
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_playground.py
      - run: node tools/verify_playground.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-native-evidence
          path: |
            playground/verification/*.json
            playground/verification/*.html
            playground/verification/*.css
            playground/verification/**/*.pdf
            playground/verification/**/*.png
          retention-days: 7
      - name: Verify downloadable playground projects
        run: |
          python -m pip install fullbleed==2.5.11 pypdf==6.19.0
          node tools/verify_project_export.mjs
          python -I tools/verify_project_export.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-project-verification
          path: playground/project-verification
          retention-days: 7
      - name: Compile and render the Rust quickstart examples
        run: python tools/verify_rust_examples.py
      - name: Verify the actual standalone Rust download
        run: |
          python -m pip install Pillow==12.3.0
          python tools/build_rust_starter.py
          git diff --exit-code -- docs/assets/rust-starter
          python tools/verify_rust_starter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-starter-verification-Linux
          path: output/rust-starter-verification
          retention-days: 14
      - name: Verify the downloadable PDF regression starter
        run: |
          python -m venv output/pdf-regression-env
          output/pdf-regression-env/bin/python -m pip install --only-binary=:all: fullbleed==2.5.3
          python tools/check_ci_starter.py --python "$PWD/output/pdf-regression-env/bin/python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-regression-download-verification
          path: output/pdf-regression-verification
          retention-days: 7
      - name: Verify the introductory Python examples
        run: |
          python -m venv output/reference-env
          output/reference-env/bin/python -m pip install --only-binary=:all: fullbleed==2.5.8
          output/reference-env/bin/python -I tools/verify_quickstarts.py
      - name: Verify the downloadable Node invoice and guide
        run: python tools/verify_node_examples.py
      - name: Verify the Node queue download and guide
        run: |
          python -m pip install pypdf==6.19.0 pypdfium2==5.14.0
          python tools/build_node_queue.py
          git diff --exit-code -- docs/assets/node-queue/project.zip docs/assets/node-queue/source.json
          python tools/verify_node_queue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-queue-verification
          path: |
            output/node-queue-verification/*.json
            output/node-queue-verification/*.txt
            output/node-queue-verification/**/*.pdf
            output/node-queue-verification/**/*.png
          retention-days: 14
      - name: Verify the downloadable Python web starter and actual HTTP servers
        run: python tools/verify_python_web_starter.py --docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-web-starter-verification
          path: |
            output/python-web-verification/*.json
            output/python-web-verification/*.log
            output/python-web-verification/checks
            output/python-web-verification/docker
          retention-days: 14
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install and execute the C# guide and invoice from NuGet
        run: |
          python -m pip install pypdf==6.1.1
          python tools/verify_dotnet_examples.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-guide-verification
          path: output/dotnet-verification
          retention-days: 14
      - name: Build and exercise the downloadable Next.js starter
        run: python tools/verify_nextjs_starter.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-download-verification
          path: |
            output/nextjs-verification/*.json
            output/nextjs-verification/*.txt
            output/nextjs-verification/*.log
            output/nextjs-verification/*.pdf
            output/nextjs-verification/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-guide-verification
          path: |
            output/node-verification/*.json
            output/node-verification/*.txt
            output/node-verification/**/*.pdf
            output/node-verification/**/*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quickstart-verification
          path: output/quickstart-verification
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: rust-quickstart-verification
          path: examples/rust/verification
      - uses: actions/upload-artifact@v4
        with:
          name: playground-verification
          path: |
            docs/assets/playground/build.json
            docs/assets/playground/verification.json
      - name: Verify renderer comparison downloads and published measurements
        run: |
          python -m pip install pypdf==6.19.0 pypdfium2==5.14.0 Pillow==12.3.0
          python tools/verify_renderer_comparison.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-comparison-verification
          path: output/renderer-comparison-verification/verification.json
          retention-days: 14
      - name: Build the downloadable browser starter and test its static demo
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          path = Path('/etc/apt/apt-mirrors.txt')
          if path.is_file():
              lines = path.read_text().splitlines()
              if any(line.startswith('https://archive.ubuntu.com/ubuntu') for line in lines):
                  path.write_text('\n'.join(line for line in lines if 'azure.archive.ubuntu.com' not in line) + '\n')
          PY
          python -m pip install -r tools/browser-requirements.txt
          python -m playwright install --with-deps chrome
          python tools/build_browser_starter.py
          python tools/check_online_starter.py browser
          python tools/check_browser_starter.py --dist docs/assets/browser-demo --out output/browser-starter-ui --browser chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-starter-verification
          path: |
            output/browser-starter/*.json
            output/browser-starter/*.log
            output/browser-starter-ui/
            output/browser-online/
          retention-days: 14
      - name: Build the exact React starter ZIP and check its live-preview workflow
        run: |
          python tools/build_react_starter.py
          python tools/check_online_starter.py react
          python tools/check_react_starter.py --dist docs/assets/react-demo --out output/react-starter-ui --browser chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-starter-verification
          path: |
            output/react-starter/*.json
            output/react-starter/*.log
            output/react-starter-ui/
            output/react-online/
          retention-days: 14
      - name: Build the exact Vue starter ZIP and check reactive previews
        run: |
          python tools/build_vue_starter.py
          python tools/check_online_starter.py vue
          python tools/check_vue_starter.py --dist docs/assets/vue-demo --out output/vue-starter-ui --browser chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vue-starter-verification
          path: |
            output/vue-starter/*.json
            output/vue-starter/*.log
            output/vue-starter-ui/
            output/vue-online/
          retention-days: 14
      - run: python -m mkdocs build --strict
      - run: python tools/check_site.py site
      - name: Include search notification ownership file
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          key = os.environ.get("INDEXNOW_KEY", "")
          if key:
              if not re.fullmatch(r"[A-Za-z0-9-]{8,128}", key):
                  raise SystemExit("Invalid IndexNow ownership key format")
              Path("site", key + ".txt").write_text(key, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, aspnet, chinese, arabic, markdown, tagged-notice, rust-download, matplotlib, numbered-report, axum, lambda-starter, n8n-workflow]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
